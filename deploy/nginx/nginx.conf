worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Correlation id: reuse the caller's if present, otherwise mint one, so a
    # request can be traced from nginx through to the Go service's logs.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$request_id_final"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # Brute-force protection for the credential endpoints. Patient search is
    # left on a looser limit because staff legitimately search in bursts.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_req_status 429;

    upstream hospital_api {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Patient payloads are small; a large body is either a mistake or an
        # attack.
        client_max_body_size 64k;
        client_body_timeout  10s;
        client_header_timeout 10s;

        # Do not advertise the nginx version to the internet.
        server_tokens off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            proxy_pass http://hospital_api;
            access_log off;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location = /readyz {
            proxy_pass http://hospital_api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Tighter limit on the endpoints that accept credentials.
        location ~ ^/staff/(create|login)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://hospital_api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://hospital_api;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
