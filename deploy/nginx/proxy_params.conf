# Shared proxy settings, included by every location block.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $request_id_final;

# A HIS lookup can take a few seconds; the Go service caps it itself with
# HIS_TIMEOUT, so these are a backstop rather than the primary limit.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Let the API's own error envelope reach the client instead of nginx's HTML
# error pages.
proxy_intercept_errors off;
