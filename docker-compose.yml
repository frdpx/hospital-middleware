services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_middleware}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital} -d ${POSTGRES_DB:-hospital_middleware}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [hospital_net]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_middleware}
      POSTGRES_SSLMODE: disable
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}
      JWT_ISSUER: ${JWT_ISSUER:-hospital-middleware}
      JWT_TTL: ${JWT_TTL:-1h}

      HIS_TIMEOUT: ${HIS_TIMEOUT:-5s}
      HIS_BASE_URL_OVERRIDE: ${HIS_BASE_URL_OVERRIDE:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [hospital_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [hospital_net]

  mockhis:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: mockhis
    restart: unless-stopped
    environment:
      MOCK_HIS_PORT: "9090"
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [hospital_net]

volumes:
  postgres_data:

networks:
  hospital_net:
    driver: bridge
